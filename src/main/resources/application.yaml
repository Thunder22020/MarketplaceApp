#file: noinspection SpringBootApplicationYaml
spring:
  application:
    name: MarketplaceApp
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        default_schema: public
        format-sql: true
        transaction:
          jta:
            platform: org.hibernate.service.jta.JtaService
app:
  cookie:
    secure: false
  jwt:
    secret-key: ${JWT_SECRET}
    access-expiration: 3600000
